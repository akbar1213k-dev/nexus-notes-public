<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, interactive-widget=resizes-content" />
    <title>Nexus Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0d1117',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for cleaner mobile UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* --- EDITOR CONTENT STYLES --- */
      
      .editor-content:empty:before {
        content: attr(data-placeholder);
        color: #9ca3af;
        pointer-events: none;
        display: block; 
      }

      /* Dark Mode Placeholder */
      .dark .editor-content:empty:before {
        color: #6b7280;
      }

      /* Headings */
      .editor-content h1 { font-size: 2.25em; font-weight: 800; margin: 0.5em 0; line-height: 1.2; }
      .editor-content h2 { font-size: 1.75em; font-weight: 700; margin: 1em 0 0.5em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; }
      .dark .editor-content h2 { border-color: #374151; }
      .editor-content h3 { font-size: 1.5em; font-weight: 600; margin: 1em 0 0.5em; }

      /* Lists */
      .editor-content ul { display: block; list-style-type: disc; margin: 1em 0; padding-left: 2em; }
      .editor-content ol { display: block; list-style-type: decimal; margin: 1em 0; padding-left: 2em; }
      .editor-content li { display: list-item; margin-bottom: 0.25em; }

      /* Checkboxes (Todo List) */
      .editor-content .todo-item {
        display: flex;
        align-items: center;
        margin-bottom: 4px;
      }
      .editor-content input[type="checkbox"] {
        margin-right: 8px;
        width: 16px;
        height: 16px;
        accent-color: #2563eb;
      }
      .editor-content .todo-item.completed span {
        text-decoration: line-through;
        opacity: 0.6;
      }

      /* Table Styles */
      .editor-content table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      .editor-content td, .editor-content th { border: 1px solid #d1d5db; padding: 8px; }
      .dark .editor-content td, .dark .editor-content th { border-color: #4b5563; }

      /* Mentions */
      .mention-chip {
        background-color: #e0f2fe;
        color: #0369a1;
        padding: 2px 6px;
        border-radius: 6px;
        font-weight: 500;
        display: inline-block;
        margin: 0 2px;
        text-decoration: none;
        user-select: none;
      }
      .dark .mention-chip {
        background-color: #1e3a8a;
        color: #bfdbfe;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "d3": "https://esm.sh/d3@^7.9.0"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 overflow-hidden fixed inset-0 transition-colors duration-300">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
